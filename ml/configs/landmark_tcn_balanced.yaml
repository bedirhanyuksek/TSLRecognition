seed: 42
num_classes: 226

data:
  train_manifest: data/manifests/train_balanced_10.csv
  train_landmarks: data/landmarks/train_balanced_10
  val_manifest: data/manifests/val_balanced_5.csv
  val_landmarks: data/landmarks/val_balanced_5

model:
  hidden_size: 256
  dropout: 0.3

training:
  epochs: 40
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  num_workers: 0
  lr_factor: 0.5
  lr_patience: 3
  min_learning_rate: 0.000001
  early_stopping_patience: 8
  output_dir: outputs/landmark_tcn_balanced
